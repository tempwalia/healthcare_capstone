<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Care Coordination Dashboard</title>
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="auth-screen" class="auth-screen"></div>

  <div id="shell" class="shell hidden">
    <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle navigation">&#9776;</button>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <span class="brand-mark">CC</span>
        <span class="brand-name">Care Coordination</span>
      </div>
      <nav id="nav" class="nav"></nav>
      <div id="health-indicator" class="health-indicator"></div>
      <div id="user-card" class="user-card"></div>
    </aside>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
