services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: health_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Temporarily pinned to the already-built local image instead of `build: .`
    # — buildx's docker-container builder is currently stuck pulling
    # moby/buildkit:buildx-stable-1 (Docker Desktop network/VM issue, not a
    # problem with this Dockerfile). This lets `docker compose up` start
    # without touching buildx at all. To rebuild after a code change, or once
    # Docker Desktop's builder is working again, restore `build: .` here (or
    # run `docker compose build api` directly) and remove this `image:` line.
    image: healthcare_capstone-api:latest
    env_file: .env
    environment:
      # Overrides whatever DATABASE_URL is in .env (typically a host-machine
      # address like localhost:5432) so the container always talks to the
      # compose-managed postgres service above, over the compose network.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/health_db
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  uploads:
